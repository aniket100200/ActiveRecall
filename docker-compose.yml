services:
  postgres:
    image: postgres:16-alpine
    container_name: revisemind-postgres
    environment:
      POSTGRES_DB: revisemind
      POSTGRES_USER: revisemind
      POSTGRES_PASSWORD: revisemind_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revisemind -d revisemind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
